<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="基于 MCP 与通义千问的智能办公助手：自然语言对话 + 工具调用" />
  <title>MCP 智能办公助手</title>
  <meta name="theme-color" content="#6b5cff" />
  <script>
    // 尽早应用主题，避免刷新时闪白
    try {
      var savedTheme = localStorage.getItem("mcp-agent-theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = savedTheme;
    } catch (e) { /* ignore */ }
  </script>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <!-- ==================== 侧边栏 ==================== -->
    <aside class="sidebar" id="sidebar" aria-label="会话侧边栏">
      <div class="brand">
        <img class="brand-logo" src="/assets/logo.svg" alt="MCP Agent logo" />
        <div class="brand-text">
          <h1>MCP 智能助手</h1>
          <p>能说 · 会做</p>
        </div>
      </div>

      <button class="new-chat" id="newChatBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        新建对话
      </button>

      <div class="session-section">
        <div class="session-label">
          <span>最近对话</span>
          <span class="session-count" id="sessionCount">0</span>
        </div>
        <div class="session-list" id="sessionList">
          <p class="session-empty">还没有对话记录</p>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="status-card" id="statusCard">
          <span class="status-dot" id="statusDot"></span>
          <div>
            <strong id="statusText">正在连接服务…</strong>
            <span id="statusSub">MCP 工具链</span>
          </div>
        </div>
        <div class="tool-badges">
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>文件读取</span>
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2M14 10h2M8 14h2M14 14h2M8 18h2M14 18h2"/></svg>计算器</span>
        </div>
        <p class="sidebar-note">支持多轮记忆 · 语音输入 · 朗读</p>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- ==================== 主区域 ==================== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开侧边栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>

        <div class="topbar-title">
          <h2 id="chatTitle">新对话</h2>
          <p id="chatSubtitle">多轮记忆已开启 · 工具调用实时可见</p>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn voice-toggle" id="voiceToggle" type="button" aria-label="自动朗读回复" aria-pressed="false" title="自动朗读回复">
            <svg class="icon-speaker" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4z" />
              <path class="wave1" d="M15.5 8.5a5 5 0 0 1 0 7" />
              <path class="wave2" d="M18.5 5.5a9 9 0 0 1 0 13" />
            </svg>
            <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4z" />
              <path d="m16 9 5 6M21 9l-5 6" />
            </svg>
          </button>
          <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="切换深色模式" title="切换主题">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2z" />
            </svg>
          </button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <!-- 欢迎页由 JS 与消息列表互斥显示 -->
        <div class="welcome" id="welcome">
          <div class="hero-orb" aria-hidden="true">
            <img src="/assets/logo.svg" alt="" />
            <span class="orbit orbit-1"></span>
            <span class="orbit orbit-2"></span>
          </div>

          <h1>你好，我是你的<br /><span class="gradient-text">智能办公助手</span></h1>
          <p class="welcome-lead">
            用一句话下达任务。我会自己判断：该聊天时聊天，该动手时调用 MCP 工具。
          </p>

          <div class="suggestions" id="suggestions">
            <button class="suggestion" type="button"
              data-prompt="帮我计算一下 (1024 × 8 + 256) ÷ 16 的结果，并解释计算过程。">
              <span class="suggestion-icon calc">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="3"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>
              </span>
              <span class="suggestion-text">
                <strong>算一算</strong>
                <span>帮我计算 (1024 × 8 + 256) ÷ 16</span>
              </span>
              <svg class="suggestion-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>

            <button class="suggestion" type="button"
              data-prompt="读取项目根目录的 README.md，然后帮我总结这个项目做了什么。">
              <span class="suggestion-icon file">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
              </span>
              <span class="suggestion-text">
                <strong>读文件</strong>
                <span>读取 README.md 并总结项目内容</span>
              </span>
              <svg class="suggestion-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>

            <button class="suggestion" type="button"
              data-prompt="先读取 requirements.txt，再告诉我运行这个项目需要安装哪些依赖。">
              <span class="suggestion-icon tool">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.2-2.2z"/></svg>
              </span>
              <span class="suggestion-text">
                <strong>多步任务</strong>
                <span>读取依赖文件并给出安装建议</span>
              </span>
              <svg class="suggestion-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>

            <button class="suggestion" type="button"
              data-prompt="你好，介绍一下你自己，你都能做什么？">
              <span class="suggestion-icon chat">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-3.4-.6L3 21l1.7-4.3A8.4 8.4 0 1 1 21 11.5z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg>
              </span>
              <span class="suggestion-text">
                <strong>聊聊天</strong>
                <span>介绍一下你自己和你的能力</span>
              </span>
              <svg class="suggestion-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>

          <div class="capabilities">
            <span><i class="cap-dot"></i>自然语言对话</span>
            <span><i class="cap-dot"></i>MCP 工具调用</span>
            <span><i class="cap-dot"></i>多轮对话记忆</span>
            <span><i class="cap-dot"></i>语音输入 / 朗读</span>
          </div>
        </div>
      </section>

      <!-- ==================== 输入区 ==================== -->
      <footer class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <textarea id="input" rows="1" maxlength="8000"
            placeholder="输入指令，例如：计算 1024 × 8…"
            aria-label="输入消息"></textarea>

          <div class="composer-actions">
            <button class="composer-btn mic-btn" id="micBtn" type="button" aria-label="语音输入" title="语音输入">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="2" width="6" height="11" rx="3" />
                <path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8" />
              </svg>
              <span class="mic-pulse" aria-hidden="true"></span>
            </button>

            <button class="composer-btn send-btn" id="sendBtn" type="submit" aria-label="发送消息">
              <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5M6 11l6-6 6 6" />
              </svg>
              <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="7" y="7" width="10" height="10" rx="2" />
              </svg>
            </button>
          </div>
        </form>
        <div class="composer-hint">
          <span id="voiceHint">Agent 可能会调用本地工具，请确认指令安全</span>
          <span class="key-hint"><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd> + <kbd>Enter</kbd> 换行</span>
        </div>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
