<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="基于 MCP 与通义千问的智能办公助手：自然语言对话 + 工具调用" />
  <title>MCP 智能办公助手</title>
  <meta name="theme-color" content="#6b5cff" />
  <script>
    // 尽早应用主题，避免刷新时闪白
    try {
      var savedTheme = localStorage.getItem("mcp-agent-theme");
      if (!savedTheme) {
        savedTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = savedTheme;
    } catch (e) { /* ignore */ }
  </script>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    /* 补充图片上传预览条的轻量样式，完美融入原有主题 */
    .upload-preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: rgba(107, 92, 255, 0.08);
      border: 1px solid rgba(107, 92, 255, 0.25);
      font-size: 13px;
    }
    .upload-preview img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
    }
    .upload-preview .upload-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upload-preview .upload-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: inherit;
      opacity: 0.7;
      font-size: 14px;
      padding: 2px 6px;
    }
    .upload-preview .upload-remove:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <!-- ==================== 侧边栏 ==================== -->
    <aside class="sidebar" id="sidebar" aria-label="会话侧边栏">
      <div class="brand">
        <img class="brand-logo" src="/assets/logo.svg" alt="MCP Agent logo" />
        <div class="brand-text">
          <h1>MCP 智能助手</h1>
          <p>能说 · 会做</p>
        </div>
      </div>

      <button class="new-chat" id="newChatBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        新建对话
      </button>

      <div class="session-section">
        <div class="session-label">
          <span>最近对话</span>
          <span class="session-count" id="sessionCount">0</span>
        </div>
        <div class="session-list" id="sessionList">
          <p class="session-empty">还没有对话记录</p>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="status-card" id="statusCard">
          <span class="status-dot" id="statusDot"></span>
          <div>
            <strong id="statusText">正在连接服务…</strong>
            <span id="statusSub">MCP 工具链</span>
          </div>
        </div>
        <div class="tool-badges">
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>文件读写</span>
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h2M14 10h2M8 14h2M14 14h2M8 18h2M14 18h2"/></svg>计算器</span>
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>视觉识别</span>
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>SQLite待办</span>
        </div>
        <p class="sidebar-note">支持多轮记忆 · 视觉识别 · 语音交互</p>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- ==================== 主区域 ==================== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开侧边栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        </button>

        <div class="topbar-title">
          <h2 id="chatTitle">新对话</h2>
          <p id="chatSubtitle">多轮记忆已开启 · 工具调用实时可见</p>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn voice-toggle" id="voiceToggle" type="button" aria-label="自动朗读回复" aria-pressed="false" title="自动朗读回复">
            <svg class="icon-speaker" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4z" />
              <path class="wave1" d="M15.5 8.5a5 5 0 0 1 0 7" />
              <path class="wave2" d="M18.5 5.5a9 9 0 0 1 0 13" />
            </svg>
            <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4z" />
              <path d="m16 9 5 6M21 9l-5 6" />
            </svg>
          </button>
          <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="切换深色模式" title="切换主题">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2z" />
            </svg>
          </button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <!-- 欢迎页由 JS 与消息列表互斥显示 -->
        <div class="welcome" id="welcome">
          <div class="hero-orb" aria-hidden="true">
            <img src="/assets/logo.svg" alt="" />
            <span class="orbit orbit-1"></span>
            <span class="orbit orbit-2"></span>
          </div>

          <h1>你好，我是你的<br /><span class="gradient-text">智能办公助手</span></h1>
          <p class="welcome-lead">
            用一句话下达任务。我会自己判断：该聊天时聊天，该动手时调用 MCP 工具。
          </p>

          <div class="suggestions" id="suggestions">
            <button class="suggestion" type="button"
              data-prompt="帮我在数据库里添加两条待办事项：1. 完成软工智能体代码提交 2. 撰写博客园随笔文档，添加后列出当前所有待办。">
              <span class="suggestion-icon file">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              </span>
              <span class="suggestion-text">
                <strong>SQLite 待办管理</strong>
                <span>向数据库写入待办任务并查询列表</span>
              </span>
              <svg class="suggestion-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>

            <button class="suggestion" type="button"
              data-prompt="帮我计算一下 (1024 × 8 + 256) ÷ 16 的结果，并读取 README.md 总结项目功能。">
              <span class="suggestion-icon tool">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="3"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>
              </span>
              <span class="suggestion-text">
                <strong>计算 + 读文件</strong>
                <span>执行安全算术计算并读取项目文档</span>
              </span>
              <svg class="suggestion-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>

            <button class="suggestion" type="button"
              data-prompt="帮我创建一个名为 plan.md 的文件，里面写一份今日的学习计划。">
              <span class="suggestion-icon calc">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
              </span>
              <span class="suggestion-text">
                <strong>创建本地文件</strong>
                <span>自动编写并保存 Markdown 计划报告</span>
              </span>
              <svg class="suggestion-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>

            <button class="suggestion" type="button"
              onclick="document.getElementById('imageInput').click()">
              <span class="suggestion-icon chat">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
              </span>
              <span class="suggestion-text">
                <strong>多模态图片识别</strong>
                <span>点击上传本地图片，提取文字或分析内容</span>
              </span>
              <svg class="suggestion-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>

          <div class="capabilities">
            <span><i class="cap-dot"></i>自然语言对话</span>
            <span><i class="cap-dot"></i>多模态图片识别</span>
            <span><i class="cap-dot"></i>文件读写与计算</span>
            <span><i class="cap-dot"></i>语音输入 / 朗读</span>
          </div>
        </div>
      </section>

      <!-- ==================== 输入区 ==================== -->
      <footer class="composer-wrap">
        <!-- 图片上传状态预览条 -->
        <div class="upload-preview" id="uploadPreview">
          <img id="uploadThumb" src="" alt="预览" />
          <span class="upload-name" id="uploadName">已附加图片</span>
          <button type="button" class="upload-remove" id="uploadRemove" title="移除图片">✕</button>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <textarea id="input" rows="1" maxlength="8000"
            placeholder="输入指令，或点击右侧相机图标上传图片识别…"
            aria-label="输入消息"></textarea>

          <!-- 隐藏的文件选择器 -->
          <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden />

          <div class="composer-actions">
            <!-- 上传图片按钮 -->
            <button class="composer-btn img-btn" id="imgBtn" type="button" aria-label="上传图片识别" title="上传图片识别" onclick="document.getElementById('imageInput').click()">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
              </svg>
            </button>

            <button class="composer-btn mic-btn" id="micBtn" type="button" aria-label="语音输入" title="语音输入">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="9" y="2" width="6" height="11" rx="3" />
                <path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8" />
              </svg>
              <span class="mic-pulse" aria-hidden="true"></span>
            </button>

            <button class="composer-btn send-btn" id="sendBtn" type="submit" aria-label="发送消息">
              <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5M6 11l6-6 6 6" />
              </svg>
              <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="7" y="7" width="10" height="10" rx="2" />
              </svg>
            </button>
          </div>
        </form>
        <div class="composer-hint">
          <span id="voiceHint">支持图片视觉识别、SQLite待办管理与本地文件读写</span>
          <span class="key-hint"><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd> + <kbd>Enter</kbd> 换行</span>
        </div>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/app.js" defer></script>

  <!-- 图片上传增强脚本：无需修改 app.js 即可联动后端 /api/upload -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const imageInput = document.getElementById("imageInput");
      const uploadPreview = document.getElementById("uploadPreview");
      const uploadThumb = document.getElementById("uploadThumb");
      const uploadName = document.getElementById("uploadName");
      const uploadRemove = document.getElementById("uploadRemove");
      const textInput = document.getElementById("input");

      let currentUploadedPath = "";

      imageInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadName.textContent = "正在上传图片...";
        uploadPreview.style.display = "flex";

        const formData = new FormData();
        formData.append("file", file);

        try {
          const resp = await fetch("/api/upload", { method: "POST", body: formData });
          if (!resp.ok) throw new Error("上传失败");
          const data = await resp.json();
          currentUploadedPath = data.path;
          uploadThumb.src = data.url;
          uploadName.textContent = `已就绪：${file.name}（发送消息即可识别）`;

          const prefix = `[已上传图片: ${currentUploadedPath}] `;
          if (!textInput.value.includes(currentUploadedPath)) {
            textInput.value = prefix + (textInput.value || "请帮我识别并详细分析这张图片的内容。");
            textInput.dispatchEvent(new Event("input", { bubbles: true }));
            textInput.focus();
          }
        } catch (err) {
          uploadName.textContent = "图片上传失败，请检查后端是否已添加 /api/upload 接口";
        }
        imageInput.value = "";
      });

      uploadRemove.addEventListener("click", () => {
        if (currentUploadedPath && textInput.value.includes(`[已上传图片: ${currentUploadedPath}] `)) {
          textInput.value = textInput.value.replace(`[已上传图片: ${currentUploadedPath}] `, "");
        }
        currentUploadedPath = "";
        uploadPreview.style.display = "none";
      });

      document.getElementById("composer").addEventListener("submit", () => {
        currentUploadedPath = "";
        uploadPreview.style.display = "none";
      });
    });
  </script>
</body>
</html>
